name: char-test
on:
  workflow_call:
    inputs:
      go-version:   { required: true,  type: string }
      dsn-env-name: { required: true,  type: string }   # e.g. FA_CHARTEST_DSN
      test-pattern: { required: false, type: string, default: "TestChar" }
      test-path:    { required: false, type: string, default: "./datastore/" }
      db-migration-ref: { required: false, type: string, default: "" }
      harness-ref:      { required: false, type: string, default: "main" }
      serial-packages:
        # รัน `go test` ทีละ package (`-p 1`) แทนที่จะปล่อยให้ Go รันขนานตามจำนวน CPU
        #
        # ทำไมถึงต้องมี: `test-path` ที่มีมากกว่าหนึ่ง package ทำให้ Go สร้าง test binary
        # คนละตัวและรัน **ขนานกัน** แต่ทุกตัวชี้ DSN ตัวเดียวกัน = **DB ก้อนเดียว** →
        # เทสต์ฝั่งหนึ่ง insert/delete แถวที่อีกฝั่งกำลัง assert อยู่
        #
        # วัดจริงบน financial-accounting-service (`./datastore/ ./service/`), DB ใหม่ต่อรอบ:
        #   ค่า default (ขนาน) : แดง 10/20 (50%) เฉลี่ย 11.1s/รอบ
        #   `-p 1`             : แดง  0/20 ( 0%) เฉลี่ย 14.0s/รอบ  (+2.9s, +26%)
        #
        # ทำไม default ยังเป็น false: 13 จาก 15 caller ส่ง package เดียว (`./datastore/`)
        # ซึ่ง `-p 1` ไม่ช่วยอะไรเลยเพราะไม่มี cross-package parallelism ตั้งแต่แรก แต่ยัง
        # serialize การ compile dependency ให้ช้าลงฟรี ๆ → เปิดเฉพาะ caller ที่ส่งหลาย package
        #
        # ⚠️ นี่คือการ**กลบอาการ** ไม่ใช่ isolation จริง — ทางแก้ที่ถูกต้องกว่าคือแยก DB
        # ต่อ package (ต้องแก้ทั้ง harness และ charDB() ของทุก repo) หรือ scope เทสต์ให้
        # ไม่ assert สถานะ global ของตารางที่ package อื่นใช้ร่วม
        required: false
        type: boolean
        default: false
      runs-on:
        # JSON array ของ label เสมอ — ดูคำอธิบายเต็ม (เหตุผล + วิธี override) ใน money-safety-gate.yml
        #   '["self-hosted","org-linux"]' (default ตั้งแต่ v1.8, Task 7) | '["ubuntu-latest"]'
        # ↩️ override กลับ hosted รายรีโป: ใส่ `runs-on: '["ubuntu-latest"]'` ใน `with:` ของ caller
        # ↩️ ถอยทั้งชุด 18 รีโป: เลื่อน moving tag `v1` กลับ (runbook §ถอนออก)
        # ⚠️ รีโปต้องอยู่ใน runner group `self-hosted-migration` (id 3) ก่อน ไม่งั้น job ค้าง queued
        required: false
        type: string
        default: '["self-hosted","org-linux"]'
      timeout-minutes:
        # default 360 = ค่า default ของ GitHub เอง → ไม่เปลี่ยนพฤติกรรมของ caller เดิม
        # caller ที่ย้ายไป self-hosted ควรตั้งให้ต่ำลง เพราะ runner มีแค่ 2 ตัว
        # job ที่ค้างจะกินคิวของทุก job ที่รออยู่เต็มเวลา timeout
        required: false
        type: number
        default: 360
    secrets:
      checkout_token:                                     # PAT w/ contents:read on the two private sibling repos
        required: false                                   # (db-migration-service + testdb-harness). Falls back to
                                                          # github.token (works only if those repos are public).
jobs:
  char-test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: chartest }
        # host port เดี่ยว (ไม่มี `:`) = ให้ Docker สุ่มพอร์ตให้ แล้วอ่านค่าจริงด้วย
        # `job.services.postgres.ports['5432']` — บน ubuntu-latest ไม่ต่างกันเพราะ VM ใช้แล้วทิ้ง
        # แต่บน self-hosted host คือเครื่อง integration env จริง การจองพอร์ตตายตัว
        # จะชนกับ job ตัวที่สอง/service ที่มาทีหลังทันทีโดยไม่มีใครเห็นสาเหตุ
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4          # caller's own repo (char test in datastore/)
      - run: git config core.quotePath false
      - name: checkout gate scripts
        uses: actions/checkout@v4
        with: { repository: gec-core-leasing-org/ci-money-safety-gate, ref: v1, path: .gate }
      - name: resolve db-migration ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.db-migration-ref }}
          CANDIDATE_REF: ${{ github.event.pull_request.head.ref }}
          GATE_TOKEN: ${{ secrets.checkout_token || github.token }}
        run: |
          ref="$(bash .gate/gate/resolve-migration-ref.sh)"; rc=$?
          echo "value=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::char-test schema ref = $ref"
          if [ "$rc" = "3" ]; then
            echo "::warning::ถาม branch ของ db-migration-service ไม่ได้ (token/เครือข่าย) — ใช้ main ตามค่าเดิม"
          elif [ "$ref" != "main" ]; then
            echo "::warning::gate นี้เขียวด้วย migration ที่ยังไม่ขึ้น main ($ref) — ต้อง merge db-migration-service ก่อน merge PR นี้"
          fi
      - uses: actions/checkout@v4          # schema owner
        with:
          repository: gec-core-leasing-org/db-migration-service
          ref: ${{ steps.ref.outputs.value }}
          path: .db-migration
          token: ${{ secrets.checkout_token || github.token }}
      - uses: actions/checkout@v4          # apply tool (cmd/apply)
        with:
          repository: gec-core-leasing-org/testdb-harness
          ref: ${{ inputs.harness-ref }}
          path: .testdb-harness
          token: ${{ secrets.checkout_token || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ inputs.go-version }}"
          # ปิด cache บน self-hosted / เปิดบน GitHub-hosted — เหตุผลเต็มใน money-safety-gate.yml
          # (v1.9, Task 8) · `inputs.runs-on` เป็น JSON array string เสมอ
          cache: ${{ !contains(inputs.runs-on, 'self-hosted') }}
      - name: apply full schema (prod order, 569 scripts)
        working-directory: .testdb-harness
        env:
          DB_MIGRATION_SERVICE_ROOT: ${{ github.workspace }}/.db-migration
          # `job` context อ่านได้เฉพาะระดับ step (steps.*.env / with / if / run)
          # อ่านใน jobs.<id>.env ไม่ได้ — ที่นี่เป็น step-level env จึงใส่ตรงนี้ได้เลย
          # ไม่ต้องผ่าน $GITHUB_ENV (ซึ่งจะทำให้ DSN ตกเป็นไฟล์ 644 บนเครื่องที่ใช้ร่วมกัน)
          APPLY_DSN: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/chartest?sslmode=disable
        run: go run ./cmd/apply
      - name: char test (DB-write round-trip) + assert it actually ran
        env:
          CHARTEST_DSN: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/chartest?sslmode=disable
        run: |
          export ${{ inputs.dsn-env-name }}="$CHARTEST_DSN"
          # step นี้รันด้วย `bash -e` — ถ้าปล่อย `out=$(go test ...)` ไว้เฉย ๆ shell จะตาย
          # ตรงบรรทัดนั้นทันทีที่ go test คืน non-zero คือ "ก่อนถึง echo" ผลคือ gate แดง
          # โดยไม่พิมพ์อะไรเลย debug ไม่ได้ ต้องปิด -e เฉพาะช่วง capture แล้วเก็บ exit code ไว้เอง
          set +e
          # serial-packages=true → `-p 1` (ทีละ package) · false → ไม่ใส่อะไรเลย = พฤติกรรมเดิม
          PFLAG=""
          [ "${{ inputs.serial-packages }}" = "true" ] && PFLAG="-p 1"
          echo "go test flags: ${PFLAG:-<default parallel>}"
          out=$(go test ${{ inputs.test-path }} $PFLAG -run '${{ inputs.test-pattern }}' -race -vet=off -v 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "$out" | grep -q "FAIL" && { echo "::error::char test FAILED"; exit 1; }
          echo "$out" | grep -qE '^(=== RUN|--- PASS)' || { echo "::error::NO char test ran — DSN/skip mis-wired (green≠pass)"; exit 1; }
          # go test แดงได้โดยไม่มีคำว่า FAIL ใน output เช่น timeout / panic ที่ถูกตัดกลางคัน
          # guard สองตัวข้างบนจึงไม่พอ ต้องเช็ค exit code ตรง ๆ ปิดท้าย
          [ "$code" -eq 0 ] || { echo "::error::go test exit=$code (output ไม่เข้าเงื่อนไขข้างบน — ดู log เต็มด้านบน)"; exit 1; }
          echo "char test ran and passed"
