name: money-safety-gate
on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
      runs-on:
        # JSON array ของ label เสมอ (ไม่ใช่ string เดี่ยว) — `runs-on:` รับ array ได้อยู่แล้ว
        # จึงใช้รูปเดียวครอบทั้ง GitHub-hosted และ self-hosted ที่ต้องระบุหลาย label
        #   self-hosted ของทีม (default) : '["self-hosted","org-linux"]'
        #   GitHub-hosted                : '["ubuntu-latest"]'
        #
        # 🔴 default = self-hosted ตั้งแต่ v1.8 (Task 7, 2026-08-16) — เปลี่ยนที่นี่ที่เดียว
        # ย้าย CI ของ caller ทั้ง 18 รีโปพร้อมกันโดยไม่ต้องแตะ `ci.yml` ของใครเลย
        # เหตุผล: `ci.yml` ของ caller 18 รีโปที่ผ่าน workflow นี้กิน **1,369 นาที = 68%**
        # ของโควตา Actions ทั้ง org (2,012 นาที ก.ค. 2026 จาก billing usage API)
        # ส่วน build/deploy ของ infra รวมกันแค่ 2 นาที → จุดที่คุ้มที่สุดคือจุดนี้จุดเดียว
        # ดู `docs/decisions/D-20260816-ci-gate-default-runner-self-hosted.md` ใน coreleasing-hub
        #
        # ⚠️ รีโปที่จะเรียกใช้ต้องอยู่ใน runner group `self-hosted-migration` (id 3,
        # visibility `selected`) ก่อน ไม่งั้น job จะค้าง `queued` จนถูกยกเลิกที่ 24 ชม.
        #
        # ↩️ override กลับ GitHub-hosted รายรีโป — ใส่ใน `ci.yml` ของรีโปนั้น:
        #     with:
        #       runs-on: '["ubuntu-latest"]'
        # ↩️ ถอยทั้งชุด 18 รีโป — เลื่อน moving tag `v1` กลับ (คำสั่งเต็มอยู่ใน runbook
        #    `docs/runbooks/self-hosted-runner.md` §ถอนออก)
        required: false
        type: string
        default: '["self-hosted","org-linux"]'
      timeout-minutes:
        # default 360 = ค่า default ของ GitHub เอง → ไม่เปลี่ยนพฤติกรรมของ caller เดิม
        # caller ที่ย้ายไป self-hosted ควรตั้งให้ต่ำลง เพราะ runner มีแค่ 2 ตัว
        # job ที่ค้างจะกินคิวของทุก job ที่รออยู่เต็มเวลา timeout
        required: false
        type: number
        default: 360
jobs:
  gate:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: checkout PR
        uses: actions/checkout@v4
        with:
          # 🔴 `fetch-depth: 0` **ห้ามลด** — gate ทั้งสี่ตัวอิง range `BASE..HEAD` /
          # `BASE...HEAD` ซึ่งต้องหา **merge-base** ได้ · shallow clone ทำให้ range แคบลง
          # **เงียบๆ** = gate เขียวทั้งที่สแกนไม่ครบ ซึ่งอันตรายกว่าช้า
          fetch-depth: 0
          # ⚡ partial clone (v1.10, Task 9): ดึง **commit graph ครบทุก commit เหมือนเดิมเป๊ะ**
          # แต่ไม่ดึง blob ของ history — blob ที่ต้องใช้จริง (ไฟล์ที่ diff แตะ) git ดึงให้เอง
          # ตอนใช้ → **range ที่สแกนเท่าเดิมทุกกรณี** รวมถึงเคส base เคลื่อน เพราะไม่มี commit
          # ไหนหายไปเลย (ต่างจาก `fetch-depth: <n>` ที่ตัด commit ทิ้งจริง และพังเคส base เคลื่อน)
          #
          # ทำไมต้องมี: หลังปิด go cache (v1.9) step นี้กลายเป็นตัวที่แพงที่สุดบน self-hosted
          # วัดจริง — commit เดียวกัน workflow เดียวกัน ต่างกันแค่ runner:
          #   GitHub-hosted (run 31922207342)  checkout PR =   9s
          #   self-hosted   (run 31926936528)  checkout PR = 216s   ← ช้ากว่า 24 เท่า
          # เครื่อง integration ต่อเน็ตธรรมดา ส่วน hosted runner อยู่ใน datacenter ของ GitHub
          # และ `financial-accounting-service` = 141MB → เป็นต้นทุน network ล้วนๆ
          #
          # เปิดเฉพาะ self-hosted — บน hosted clone เต็มเร็วอยู่แล้ว (9s)
          # ⚠️ `inputs.runs-on` เป็น **JSON array string** ('["ubuntu-latest"]') ห้ามเทียบ `==`
          filter: ${{ contains(inputs.runs-on, 'self-hosted') && 'blob:none' || '' }}
      - name: disable path quoting (non-ASCII filenames)
        run: git config core.quotePath false
      - name: checkout gate scripts
        uses: actions/checkout@v4
        with: { repository: gec-core-leasing-org/ci-money-safety-gate, ref: v1, path: .gate }
      - name: diff range
        # guard (v1.10, Task 9): ถ้าประวัติไม่พอสำหรับ range ให้ **แดงดังๆ** ไม่ใช่สแกนแคบลงเงียบๆ
        # และพิมพ์ merge-base + จำนวน commit ใน range ลง log เพื่อให้เทียบข้าม runner /
        # ข้ามเวอร์ชันได้ว่า "สแกน range เดียวกันจริงไหม"
        run: |
          set -euo pipefail
          B="${{ github.event.pull_request.base.sha }}"
          H="${{ github.event.pull_request.head.sha }}"
          git cat-file -e "${B}^{commit}" 2>/dev/null || { echo "::error::BASE_SHA $B ไม่อยู่ใน clone — ประวัติไม่ครบ"; exit 1; }
          git cat-file -e "${H}^{commit}" 2>/dev/null || { echo "::error::HEAD_SHA $H ไม่อยู่ใน clone — ประวัติไม่ครบ"; exit 1; }
          MB="$(git merge-base "$B" "$H")" || { echo "::error::หา merge-base ของ $B กับ $H ไม่ได้ — ประวัติไม่ครบ"; exit 1; }
          N="$(git rev-list --count "${B}..${H}")"
          echo "gate-range merge-base=$MB commits_in_range=$N base=$B head=$H"
          echo "BASE_SHA=$B" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$H" >> "$GITHUB_ENV"
      - name: check no-new-float-on-money
        run: bash .gate/gate/check-no-float.sh
      - name: check money-file-needs-test
        env:
          GATE_SKIP_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'skip-test-gate') && '1' || '0' }}
        run: bash .gate/gate/check-needs-test.sh
      - name: check sqli-pattern
        run: bash .gate/gate/check-sqli.sh
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ inputs.go-version }}"
          # 🔴 ปิด cache เมื่อรันบน self-hosted (v1.9, Task 8, 2026-08-16)
          # วัดจริงใน Task 7: post-step "Post setup go" (อัปโหลด GOMODCACHE+GOCACHE ขึ้น
          # GitHub cache service) กิน **35–68% ของเวลาทั้ง job** — `financial-service`
          # ใช้ 234s จาก 344s ทั้งที่งานจริงแค่ 88s และ load เครื่องตกเหลือ 0.42 ตลอดช่วงนั้น
          # (= network ไม่ใช่ CPU) · runner มีแค่ 2 ตัว → job ที่ยึด runner ไว้เฉยๆ = คิวยาว
          #
          # บน self-hosted cache นี้ **ซ้ำซ้อน** เพราะ cache ของ Go อยู่บนดิสก์ข้ามรอบอยู่แล้ว
          # (ยืนยันบนเครื่อง 2026-08-16: `/home/ghrunner/go/pkg/mod` 492M ·
          #  `/home/ghrunner/.cache/go-build` 2.9G — user เดียวกันทุก job ทุก runner)
          #
          # บน GitHub-hosted **ยังเปิดไว้** เพราะ VM ใหม่ทุกครั้ง cache มีประโยชน์จริง
          # → เงื่อนไขอ่านจาก `inputs.runs-on` ซึ่งเป็น JSON array string เสมอ
          #   '["self-hosted","org-linux"]' -> false (ปิด) · '["ubuntu-latest"]' -> true (เปิด)
          # ใช้ `contains` กับ string ตรงๆ ไม่ `fromJSON` เพราะต้องการให้ label set ใดก็ตาม
          # ที่มี `self-hosted` ปิด cache หมด โดยไม่ต้องรู้ว่ามี label อะไรอีกบ้าง
          cache: ${{ !contains(inputs.runs-on, 'self-hosted') }}
      - name: go test -race
        # -vet=off: skip the auto-vet pass that go test runs before tests. Newer
        # Go toolchains (1.24+) promote "non-constant format string" to a hard
        # build error, which fails legacy repos on pre-existing log.Errorf(msg)
        # calls unrelated to money safety. The gate's real checks (float64/SQLi
        # scans, the tests themselves) still run. char-test.yml already does this.
        run: go test -race -vet=off ./...
      - name: gitleaks (secret scan, ratchet — เฉพาะ commit ใหม่ใน PR)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --log-opts="$BASE_SHA..$HEAD_SHA" --redact --no-banner